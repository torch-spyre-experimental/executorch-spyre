  - name: "aten::mm"
    validated: true
    since_phase: 2
    note: "64x64 fp16 matmul, on-device 0/4096 outside envelope"
  - name: "aten::addmm"
    validated: true
    since_phase: 3
    note: "MLP Linear bias-add + matmul"
  - name: "aten::bmm"
    validated: true
    since_phase: 8
    note: "8a follow-up: runs+matches on device (max_abs_err 0.094, envelope ok). Prior runs=FAIL was a delegate bug, NOT SDSC: the single bmm kernel allocates a workspace tensor the v1 layout mislabeled as a 2nd output; fixed by routing single-kernel-with-intermediate through the v2 payload. Backs 8c attention scores/context."
  - name: "aten::matmul"
    validated: true
    since_phase: 8
    note: "8a follow-up: runs+matches on device via the same single-kernel-with-workspace v1->v2 fix as bmm (3D probe). NOTE: 4D matmul still compile-blocked upstream (insert_bmm_padding 'Incompatible host_size and dim_order') — see reports/upstream-issues/phase8-matmul-4d.md."
  - name: "aten::_scaled_mm"
    validated: false

