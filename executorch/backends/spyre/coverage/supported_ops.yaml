# Spyre delegate — op allowlist (source of truth for the partitioner).
#
# Used by the partitioner in both partition modes
# (see docs/operator-guide.md#partition-modes):
#   allowlist     (conservative / CI)  delegates ONLY entries with `validated: true`.
#   fallbacklist  (production default) delegates everything torch-spyre does not
#                 list as a CPU fallback EXCEPT entries with `validated: false`,
#                 which stay on CPU in both modes.
# An op is marked validated exactly when an on-device compile+run through the coverage
# harness (coverage/run_coverage.py) confirmed SDSC lowers it AND the result
# matched the CPU fp16 reference. Everything else is the queue: candidate ops
# seeded from torch-spyre's known-good lowerings, delegated only once proven.
#
# This is the "fail loudly, never miscompile" contract — claim an op only after
# the device says yes. Schema is parsed by coverage/ops_registry.py; keep it to
# the constrained form (a top-level `ops:` list of flat `- name:/validated:/...`
# mappings) so the zero-dependency host-CI parser (_yaml_compat) accepts it.
#
# Fields per entry:
#   name        core-aten op.name() (e.g. "aten::mm") — REQUIRED, must contain "::"
#   validated   confirmed on a Spyre device end-to-end?  (default false)
#   since_phase phase that validated/introduced the entry (informational)
#   note        short human note
#
# Phase 8 (8a) device sweep @ 2026-07-27: 38 probes, 30 compile, 26 run,
# 24 match on-device. 19 ops promoted here from the compiling set; the rest are
# annotated with their device-observed failure (queue for 8b / follow-up).

ops:
