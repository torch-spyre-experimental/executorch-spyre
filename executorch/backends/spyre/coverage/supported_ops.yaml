    validated: false
    note: "8a follow-up (LD_LIBRARY_PATH-fixed re-probe): compiles(1 kernel), runs=PASS, matches=FAIL — fused rms_norm executes on-device but is numerically outside the fp16 envelope. NOT on the critical path: Granite uses RMSNorm-as-math (mul/pow/mean/add/rsqrt, all validated), which fully delegates (see test_rmsnorm_math_fully_delegated). Left off allowlist; upstream numeric bug is an 8b issue-draft candidate."
