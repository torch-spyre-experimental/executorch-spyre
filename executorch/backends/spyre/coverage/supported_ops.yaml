  - name: "aten::_reshape_alias_copy"
    validated: true
    since_phase: 8
    note: "8a device sweep: runs+matches within fp16 envelope"
  - name: "aten::slice_copy"
    validated: false
    note: "8c: pure data-movement, lowers to ZERO SDSC compute kernels so the coverage harness cannot probe it standalone ('preprocess: no SDSC kernel was emitted'). NOT device-validated -- kept off the allowlist per the no-flip-without-green-run contract. The 8c attention path was rewritten to per-head Linear(E,D) projections precisely to eliminate the head slice_copy: a single Linear(E,H*D) interleaves heads on the innermost dim, so slicing head h off the [1,S,H,D] view yields a gappy H*D-strided [S,D] that trips the SDSC inductor coordinate normalizer ('Unsupported coordinate expression 65*c1/64'). Per-head projection makes each head dense contiguous, so there is no slice_copy on the device path at all."
  - name: "aten::select_copy"
    validated: false
    note: "compile FAIL: stick incompatibility (gather across sticks). Rewrite to slice_copy in layer authoring (8b)."
  - name: "aten::clone"
    validated: true
    since_phase: 8
    note: "8a device sweep: runs+matches within fp16 envelope"
  - name: "aten::cat"
    validated: false
    note: "8a follow-up (dim-resolved re-probe): device cat is CORRECT along leading/sequence dims (dim=0: max_abs_err 0.002, 0/128 outside; dim=1 of 3D [B,S,D], the KV-cache case: 0.002, 0/576 outside) but SCRAMBLES along the innermost/stick dim (dim=-1: max_abs_err 3.53, 60/64 outside) — an SDSC stick-layout bug. Stays validated:false because a blanket allowlist entry would wrongly delegate innermost-dim cats: RoPE rotate_half does cat([-x2,x1],dim=-1), which would silently miscompile. Used deliberately IN-CONTEXT: the 8b cat-based KV cache (seq-dim concat) is device-safe; RoPE authoring must AVOID the innermost cat (8b). Upstream issue-draft candidate (stick-dim concat)."
  - name: "aten::constant_pad_nd"
    validated: false

  # --- dtype ---
  - name: "aten::_to_copy"
    validated: false
    note: "8a follow-up (LD_LIBRARY_PATH-fixed re-probe): compiles(1 kernel), runs=PASS, matches=FAIL — the on-device fp16->fp32 cast produces garbage (max_abs_err 4.13, 53/64 outside envelope), a real SDSC numeric bug not a masked note. Off the critical path: the decoder layer avoids _to_copy entirely by keeping every constant fp16 (see RMSNormMath eps-as-fp16-buffer authoring rule in test_partitioner.py), so to_edge inserts no _to_dim_order_copy cast. Left off allowlist; upstream numeric bug is an 8b issue-draft candidate."

